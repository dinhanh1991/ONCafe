<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Theo dõi trạng thái các đơn hàng đã đặt tại ONCafe.">
    <title>Đơn hàng của tôi - ONCafe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/my-orders.css">

<body>
    <header class="site-header">
        <a class="brand" href="./home.html">ONCafe</a>
        <nav id="customerNav" aria-label="Điều hướng chính">
