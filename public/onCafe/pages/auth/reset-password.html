<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - ONCafe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/reset-password.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../customer/home.html">ONCafe</a>
        <nav aria-label="Điều hướng chính">
            <a href="../customer/home.html">Trang chủ</a>
            <a href="./login.html">Đăng nhập</a>
        </nav>
    </header>

    <main class="auth-container reset-password-container">
        <section class="auth-card reset-password-card" aria-labelledby="resetPasswordTitle">
            <p class="reset-password-eyebrow">BẢO MẬT TÀI KHOẢN</p>
            <h1 id="resetPasswordTitle">Đặt lại mật khẩu</h1>
            <p>Tạo mật khẩu mới để tiếp tục sử dụng tài khoản ONCafe.</p>

            <form id="resetPasswordForm" novalidate>
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="password"
                        placeholder="Ít nhất 6 ký tự" autocomplete="new-password"
                        minlength="6" required>
                </div>
                <button class="auth-button" type="submit">Lưu mật khẩu mới</button>
                <p id="resetPasswordMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                <a href="./login.html">Quay lại đăng nhập</a>
            </p>
        </section>
    </main>
    <script type="module" src="../../js/views/auth/AuthView.js"></script>
    <script type="module" src="../../js/views/shared/SiteFooterView.js"></script>
</body>
</html>
