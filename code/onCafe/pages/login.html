<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ONCafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="./home.html">ONCafe</a>
        <nav aria-label="Điều hướng chính">
            <a href="./home.html">Trang chủ</a>
            <a href="./register.html">Đăng ký</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <h1>Đăng nhập</h1>
            <p>Chào mừng bạn quay trở lại ONCafe!</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                        placeholder="Nhập email của bạn" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password"
                        placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                </div>
                <button class="auth-button" type="submit">Đăng nhập</button>
                <p id="loginMessage" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
            </p>
        </section>
    </main>
    <script type="module" src="../js/views/AuthView.js"></script>
</body>
</html>
