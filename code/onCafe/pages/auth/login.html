<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - ONCafe</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../customer/home.html">ONCafe</a>
        <nav aria-label="Điều hướng chính">
            <a href="../customer/home.html">Trang chủ</a>
            <a href="./register.html">Đăng ký</a>
        </nav>
    </header>

    <main class="auth-container login-container">
        <section class="auth-card login-card" aria-labelledby="loginTitle">
            <div class="login-visual">
                <img src="../../assets/images/ca-phe-sua.jpg" alt="Ly cà phê sữa đá của ONCafe">
                <div class="login-visual-copy">
                    <a class="login-visual-brand" href="../customer/home.html">ONCafe</a>
                    <p class="login-eyebrow">CÀ PHÊ NGON, NGÀY THÊM VUI</p>
                    <h2>Chào mừng bạn trở lại.</h2>
                    <p>Đăng nhập để khám phá thức uống yêu thích và tiếp tục hành trình cùng ONCafe.</p>
                </div>
            </div>

            <div class="login-content">
                <div class="login-heading">
                    <p class="login-eyebrow">TÀI KHOẢN ONCAFE</p>
                    <h1 id="loginTitle">Đăng nhập</h1>
                    <p>Nhập thông tin tài khoản để tiếp tục.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                            placeholder="name@example.com" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password"
                                placeholder="Nhập mật khẩu của bạn"
                                autocomplete="current-password" required>
                            <button type="button" id="togglePassword" class="password-toggle"
                                aria-label="Hiện mật khẩu" aria-controls="password"
                                aria-pressed="false">Hiện</button>
                        </div>
                    </div>
                    <button class="forgot-password" id="forgotPassword" type="button">
                        Quên mật khẩu?
                    </button>
                    <button class="auth-button" type="submit">Đăng nhập</button>
                    <p id="loginMessage" role="status" aria-live="polite"></p>
                </form>

                <p class="auth-switch">
                    Chưa có tài khoản? <a href="./register.html">Đăng ký ngay</a>
                </p>
            </div>
        </section>
    </main>
    <script type="module" src="../../js/views/AuthView.js"></script>
</body>
</html>
